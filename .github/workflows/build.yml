name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android32
            target: Android32
          - name: Android64
            target: Android64
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          combine: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowcaseKit-${{ matrix.name }}
          path: build/*.geode
